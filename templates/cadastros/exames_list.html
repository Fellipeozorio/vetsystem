{% extends 'cadastros/base_list.html' %}

{% block table_header %}
<th>Nome</th>
<th>Status</th>
<th class="w-1">Ações</th>
{% endblock %}

{% block table_row %}
<td><strong>{{ item.nome }}</strong></td>
<td>
  {% if item.ativo %}
  <span class="badge bg-success text-white">Ativo</span>
  {% else %}
  <span class="badge bg-danger text-white">Inativo</span>
  {% endif %}
</td>
<td onclick="event.stopPropagation()">
  <div class="btn-list flex-nowrap">
    <a href="{% url 'cadastros:exame_edit' item.id %}" class="btn btn-sm btn-icon btn-ghost-secondary" title="Editar">
      <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" /><path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" /><path d="M16 5l3 3" /></svg>
    </a>
    <button class="btn btn-sm btn-icon btn-ghost-danger" onclick="deleteItem({{ item.id }}, '{{ item.nome|escapejs }}')" title="Excluir">
      <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7l16 0" /><path d="M10 11l0 6" /><path d="M14 11l0 6" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /></svg>
    </button>
  </div>
</td>
{% endblock %}

{% block extra_js %}
<script>
// Sobrescrever funções globais do base_list.html para redirecionar para páginas completas
function openAddOffcanvas() {
  window.location.href = "{% url 'cadastros:exame_create' %}";
}

function viewItem(id) {
  window.location.href = `/cadastros/exames/${id}/editar/`;
}

function editItem(id) {
  window.location.href = `/cadastros/exames/${id}/editar/`;
}

// Função de deletar via AJAX
function deleteItem(id, nome) {
  if (!confirm(`Tem certeza que deseja excluir o exame "${nome}"?`)) {
    return;
  }
  
  fetch(`/cadastros/exames/${id}/excluir/`, {
    method: 'POST',
    headers: {
      'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
      'X-Requested-With': 'XMLHttpRequest'
    }
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      location.reload();
    } else {
      alert('Erro ao excluir: ' + (data.error || 'Erro desconhecido'));
    }
  })
  .catch(error => {
    alert('Erro ao excluir: ' + error);
  });
}
</script>
{% endblock %}
