<!-- Formulário de Exame -->
<div id="form-exame" class="form-record">
  <!-- Cabeçalho -->
  <div class="form-record-header">
    <div class="form-record-title-section">
      <div class="form-record-icon-title">
        <i class="ti ti-test-pipe form-record-icon" style="color: #FA8072;"></i>
        <h4 class="form-record-title" style="color: #FA8072;">Exame em</h4>
        <span id="exame-datetime" class="form-record-datetime" style="color: #FA8072;">{{ now|date:"d/m/Y H:i" }}</span>
        <button type="button" class="btn btn-link btn-sm p-0" onclick="editDatetime('exame-datetime')" title="Editar data/hora" style="color: #FA8072;">
          <i class="ti ti-pencil" style="font-size: 20px;"></i>
        </button>
      </div>
      <p class="form-record-user">Por: {{ user.get_full_name|default:user.username }}</p>
    </div>
    <button type="button" class="btn-close" onclick="hideAllForms()"></button>
  </div>

  <!-- Campo hidden para ID do registro (usado na edição) -->
  <input type="hidden" id="exame-id" name="exame_id" value="">

  <!-- Select do exame cadastrado (igual ao formulário de documentos) -->
  <div class="row mb-3">
    <div class="col-9">
      <label class="form-label">Exame <span class="text-danger">*</span></label>
      <select class="form-select" id="select-exame-prontuario" onchange="carregarAtributosExameProntuario()">
        <option value="">Selecione um exame...</option>
        {% for exame in exames_cadastro %}
        <option value="{{ exame.id }}" data-nome="{{ exame.nome|escapejs }}">{{ exame.nome }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Select de tabela de referência (condicional: aparece quando há múltiplas referências) -->
  <div class="row mb-3" id="row-select-referencia" style="display:none;">
    <div class="col-9">
      <label class="form-label">Tabela de Referência</label>
      <select class="form-select" id="select-referencia-exame" onchange="trocarReferenciaExame()">
      </select>
    </div>
  </div>

  <!-- Área que aparece após selecionar o exame -->
  <div id="exame-area-conteudo" style="display:none;">

    <!-- Tabela de referência -->
    <div class="mb-3" id="exame-tabela-wrapper">
      <p class="text-muted fst-italic" id="exame-msg-carregando" style="display:none;">Carregando atributos...</p>
      <div id="exame-tabela-container" style="display:none;">
        <div class="table-responsive">
          <table class="table table-sm table-vcenter" style="font-size:.9rem;">
            <thead>
              <tr>
                <th>Atributo</th>
                <th style="width:160px;">Resultado</th>
                <th style="width:160px; padding-left:16px;">Referência</th>
              </tr>
            </thead>
            <tbody id="tbody-exame-atributos">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- HugeRTE - Conclusões -->
    <div class="mb-3" id="editor-wrapper-exame">
      <label class="form-label">Conclusões</label>
      <div id="loading-editor-exame" style="height: 320px; border: 1px solid #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: #f8fafc; color: #64748b; font-size: 14px;">
        Carregando editor...
      </div>
      <div id="editor-container-exame" style="display: none;">
        <textarea id="editor-exame"></textarea>
      </div>
    </div>

    <!-- Upload de arquivos -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Anexos</label>
        <input type="file" class="form-control" id="file-exame" accept=".pdf,.jpg,.jpeg,.png" multiple>
        <div id="file-badges-exame" class="file-badges mt-2"></div>
      </div>
    </div>

  </div>

  <!-- Botões de ação -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn btn-danger btn-delete-record" onclick="deleteCurrentRecord()" style="display: none;">
      <i class="ti ti-trash"></i>
      Excluir
    </button>
    <div class="d-flex gap-2 ms-auto">
      <button type="button" class="btn btn-secondary" onclick="hideAllForms()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="save-exame">Salvar Exame</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function toLocalISOString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;
  }

  const usuarioAvatar = '{% if user.userprofile.avatar %}{{ user.userprofile.avatar.url }}{% else %}{{ user.userprofile.get_avatar_url }}{% endif %}';
  let uploadedFilesExame = [];
  const fileInputExame = document.getElementById('file-exame');
  const fileBadgesExame = document.getElementById('file-badges-exame');
  let itensExame = [];
  let exameTemReferencia = false;
  let referenciaAtualId = null;
  let editorExameInit = false;

  // ── Inicializar HugeRTE para conclusões ──
  function iniciarEditorExame() {
    if (editorExameInit) return;
    editorExameInit = true;

    const loading = document.getElementById('loading-editor-exame');
    const container = document.getElementById('editor-container-exame');

    if (!window.HugeRTEEditor) {
      // Fallback: mostrar textarea diretamente
      if (loading) loading.style.display = 'none';
      if (container) {
        container.style.display = 'block';
        const ta = document.getElementById('editor-exame');
        if (ta) { ta.style.display = 'block'; ta.rows = 6; ta.className = 'form-control'; }
      }
      return;
    }

    HugeRTEEditor.init('#editor-exame', { height: 320, min_height: 320 }, 'exame-editor')
      .then(() => {
        if (loading) loading.style.display = 'none';
        if (container) container.style.display = 'block';
      })
      .catch(() => {
        if (loading) loading.style.display = 'none';
        if (container) {
          container.style.display = 'block';
          const ta = document.getElementById('editor-exame');
          if (ta) { ta.style.display = 'block'; ta.rows = 6; ta.className = 'form-control'; }
        }
      });
  }

  function getEditorExameContent() {
    if (window.HugeRTEEditor) {
      const c = HugeRTEEditor.getContent('exame-editor');
      if (c !== null) return c;
    }
    const ta = document.getElementById('editor-exame');
    return ta ? ta.value : '';
  }

  function setEditorExameContent(html) {
    if (window.HugeRTEEditor && HugeRTEEditor.getEditor('exame-editor')) {
      HugeRTEEditor.setContent('exame-editor', html);
      return;
    }
    const ta = document.getElementById('editor-exame');
    if (ta) ta.value = html;
  }

  // ── Carregar atributos ao selecionar exame ──
  function carregarAtributosExameProntuario() {
    const select = document.getElementById('select-exame-prontuario');
    const exameId = select.value;
    const areaConteudo = document.getElementById('exame-area-conteudo');
    const tabelaWrapper = document.getElementById('exame-tabela-wrapper');
    const tabelaContainer = document.getElementById('exame-tabela-container');
    const msg = document.getElementById('exame-msg-carregando');
    const tbody = document.getElementById('tbody-exame-atributos');

    if (!exameId) {
      areaConteudo.style.display = 'none';
      itensExame = [];
      exameTemReferencia = false;
      referenciaAtualId = null;
      document.getElementById('row-select-referencia').style.display = 'none';
      return;
    }

    areaConteudo.style.display = '';
    tabelaWrapper.style.display = 'none';
    tabelaContainer.style.display = 'none';
    msg.style.display = '';
    tbody.innerHTML = '';
    itensExame = [];

    iniciarEditorExame();

    const petId = window.CURRENT_PET_ID;
    _fetchAtributosExame(petId, exameId, null);
  }
  window.carregarAtributosExameProntuario = carregarAtributosExameProntuario;

  function trocarReferenciaExame() {
    const exameId = document.getElementById('select-exame-prontuario').value;
    const referenciaId = document.getElementById('select-referencia-exame').value;
    const petId = window.CURRENT_PET_ID;
    const tabelaWrapper = document.getElementById('exame-tabela-wrapper');
    const tabelaContainer = document.getElementById('exame-tabela-container');
    const msg = document.getElementById('exame-msg-carregando');
    const tbody = document.getElementById('tbody-exame-atributos');
    tabelaWrapper.style.display = 'none';
    tabelaContainer.style.display = 'none';
    msg.style.display = '';
    tbody.innerHTML = '';
    itensExame = [];
    _fetchAtributosExame(petId, exameId, referenciaId || null);
  }
  window.trocarReferenciaExame = trocarReferenciaExame;

  function _fetchAtributosExame(petId, exameId, referenciaId) {
    const tabelaWrapper = document.getElementById('exame-tabela-wrapper');
    const tabelaContainer = document.getElementById('exame-tabela-container');
    const msg = document.getElementById('exame-msg-carregando');
    const tbody = document.getElementById('tbody-exame-atributos');
    const rowRef = document.getElementById('row-select-referencia');
    const selectRef = document.getElementById('select-referencia-exame');

    let url = `/atendimento/api/${petId}/exame-atributos/${exameId}/`;
    if (referenciaId) url += `?referencia_id=${referenciaId}`;

    fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
    .then(r => r.json())
    .then(resp => {
      msg.style.display = 'none';
      if (!resp.success) {
        tabelaWrapper.style.display = 'none';
        rowRef.style.display = 'none';
        return;
      }

      // Popular select de referências ANTES de verificar atributos
      referenciaAtualId = resp.referencia_id || null;
      const refs = resp.referencias || [];
      if (refs.length >= 1) {
        selectRef.innerHTML = refs.map(r =>
          `<option value="${r.id}"${r.id == referenciaAtualId ? ' selected' : ''}>${r.nome}</option>`
        ).join('');
        rowRef.style.display = '';
      } else {
        rowRef.style.display = 'none';
      }

      if (!resp.atributos || resp.atributos.length === 0) {
        // Sem atributos: ocultar tabela mas mantém o select de referências visível se houver
        tabelaWrapper.style.display = 'none';
        return;
      }

      exameTemReferencia = resp.exame_tem_referencia || false;
      itensExame = resp.atributos.map(a => ({
        atributo_id: a.id,
        nome: a.nome,
        unidade: a.unidade || '',
        tipo_dado: a.tipo_dado || '',
        atributo_pai_id: a.atributo_pai_id ?? null,
        ref_inicio: a.ref_inicio || '',
        ref_fim: a.ref_fim || '',
        resultado: '',
      }));
      renderizarTabelaExame();
      tabelaWrapper.style.display = '';
      tabelaContainer.style.display = '';
    })
    .catch(() => {
      msg.style.display = 'none';
      tabelaWrapper.style.display = 'none';
    });
  }

  function renderizarTabelaExame() {
    const tbody = document.getElementById('tbody-exame-atributos');
    tbody.innerHTML = '';

    // Coluna de referência visível se o exame tem referências cadastradas (qualquer espécie)
    const numColunas = exameTemReferencia ? 3 : 2;

    // Mostrar/ocultar coluna de referência no cabeçalho
    const table = tbody.closest('table');
    const thRef = table.querySelector('thead tr th:nth-child(3)');
    if (thRef) {
      thRef.style.display = exameTemReferencia ? '' : 'none';
    }

    itensExame.forEach((item, idx) => {
      const tr = document.createElement('tr');

      // Linha de grupo: sem pai e tem filhos
      const ePai = item.atributo_pai_id === null;
      const temFilhos = ePai && itensExame.some(i => i.atributo_pai_id === item.atributo_id);
      if (temFilhos) {
        tr.innerHTML = `<td colspan="${numColunas}"><strong>${item.nome}</strong></td>`;
        tbody.appendChild(tr);
        return;
      }

      // Referência formatada: "início – fim unidade"
      let refTexto = '';
      if (item.ref_inicio && item.ref_fim) {
        refTexto = `${item.ref_inicio} – ${item.ref_fim}`;
        if (item.unidade) refTexto += ' ' + item.unidade;
      } else if (item.ref_inicio) {
        refTexto = item.ref_inicio;
        if (item.unidade) refTexto += ' ' + item.unidade;
      } else if (item.ref_fim) {
        refTexto = item.ref_fim;
        if (item.unidade) refTexto += ' ' + item.unidade;
      }

      const inputType = (item.tipo_dado === 'decimal' || item.tipo_dado === 'inteiro') ? 'number' : 'text';
      const stepAttr = item.tipo_dado === 'decimal' ? 'step="any"' : '';
      const indent = !ePai ? '&nbsp;&nbsp;&nbsp;&nbsp;' : '';

      const tdRef = exameTemReferencia
        ? `<td class="text-secondary" style="white-space:nowrap;vertical-align:middle;display:table-cell;padding-left:16px;">${refTexto}</td>`
        : '';

      tr.innerHTML = `
        <td style="vertical-align:middle;">${indent}${item.nome}</td>
        <td style="vertical-align:middle; width:180px;">
          <div class="input-group">
            <input type="${inputType}" ${stepAttr} class="form-control"
              value="${item.resultado}"
              onchange="itensExame[${idx}].resultado=this.value">
            ${item.unidade ? `<span class="input-group-text">${item.unidade}</span>` : ''}
          </div>
        </td>
        ${tdRef}
      `;
      tbody.appendChild(tr);
    });
  }

  // ── File upload ──
  fileInputExame?.addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      if (!uploadedFilesExame.find(f => f.name === file.name)) {
        uploadedFilesExame.push(file);
        const badge = document.createElement('span');
        badge.className = 'badge bg-secondary';
        badge.innerHTML = `${file.name} <i class="ti ti-x"></i>`;
        badge.onclick = () => { uploadedFilesExame = uploadedFilesExame.filter(f => f.name !== file.name); badge.remove(); };
        fileBadgesExame.appendChild(badge);
      }
    });
    fileInputExame.value = '';
  });

  // ── Salvar ──
  document.getElementById('save-exame')?.addEventListener('click', function() {
    const select = document.getElementById('select-exame-prontuario');
    const exameCadastroId = select.value;
    const exameNome = select.options[select.selectedIndex]?.dataset.nome || select.options[select.selectedIndex]?.text || '';

    if (!exameCadastroId) {
      showDangerModal('Erro de Validação', 'Selecione um exame');
      return;
    }

    const formData = new FormData();
    formData.append('exame_cadastro_id', exameCadastroId);
    formData.append('nome', exameNome);
    formData.append('tipo', '');
    formData.append('resultado', '');
    formData.append('itens_resultado', JSON.stringify(itensExame.map(i => ({
      atributo_id: i.atributo_id,
      nome: i.nome,
      unidade: i.unidade,
      resultado: i.resultado,
      ref_inicio: i.ref_inicio,
      ref_fim: i.ref_fim,
    }))));
    formData.append('conclusoes', getEditorExameContent());

    uploadedFilesExame.forEach(file => formData.append('arquivos', file));

    const datetimeSpan = document.getElementById('exame-datetime');
    const now = new Date();
    const isoDate = datetimeSpan?.dataset.isoDate || toLocalISOString(now);
    formData.append('data_hora', isoDate.slice(0, 16));

    const exameId = document.getElementById('exame-id')?.value;
    if (exameId) formData.append('exame_id', exameId);

    const petId = window.CURRENT_PET_ID;
    if (!petId) {
      showDangerModal('Erro de Configuração', 'ID do animal não encontrado');
      return;
    }

    fetch(`/atendimento/api/${petId}/exame/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      body: formData,
      credentials: 'same-origin'
    })
    .then(response => {
      const contentType = response.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        return response.text().then(() => { throw new Error('Servidor retornou HTML ao invés de JSON. Verifique autenticação.'); });
      }
      return response.json();
    })
    .then(data => {
      if (data.success) {
        if (exameId) {
          const timeline = document.querySelector('#timeline-list');
          if (timeline) timeline.innerHTML = '';
          carregarTimeline();
        } else {
          adicionarItemTimeline('exame', exameNome, isoDate, exameNome, '{{ user.get_full_name|default:user.username }}', usuarioAvatar, data.id);
        }
        hideAllForms();
        showSuccessModal('Sucesso!', exameId ? 'Exame atualizado com sucesso!' : 'Exame salvo com sucesso!');
        uploadedFilesExame = [];
        fileBadgesExame.innerHTML = '';
        itensExame = [];
      } else {
        showDangerModal('Erro ao Salvar', data.error || 'Ocorreu um erro ao salvar o exame');
      }
    })
    .catch(error => {
      showDangerModal('Erro de Conexão', 'Não foi possível conectar ao servidor: ' + error.message);
    });
  });

  // ── Preencher form ao editar ──
  window._preencherFormExame = function(dados) {
    document.getElementById('exame-id').value = dados.id || '';
    const select = document.getElementById('select-exame-prontuario');
    if (dados.exame_cadastro_id) {
      select.value = dados.exame_cadastro_id;
    }
    if (select.value) {
      carregarAtributosExameProntuario();
      const tentarPreencher = (tentativas) => {
        setTimeout(() => {
          if (itensExame.length > 0) {
            try {
              const itensExistentes = dados.itens_resultado ? JSON.parse(dados.itens_resultado) : [];
              itensExistentes.forEach(ie => {
                const idx = itensExame.findIndex(i => i.atributo_id === ie.atributo_id);
                if (idx >= 0) itensExame[idx].resultado = ie.resultado || '';
              });
              renderizarTabelaExame();
            } catch(e) {}
          } else if (tentativas > 0) {
            tentarPreencher(tentativas - 1);
          }
        }, 500);
      };
      tentarPreencher(6);
    }
    if (dados.conclusoes) {
      setTimeout(() => setEditorExameContent(dados.conclusoes), 1000);
    }
  };
});
</script>
