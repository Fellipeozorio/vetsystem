<!-- Formulário de Fotos -->
<div id="form-fotos" class="form-record">
  <!-- Cabeçalho -->
  <div class="form-record-header">
    <div class="form-record-title-section">
      <div class="form-record-icon-title">
        <i class="ti ti-camera form-record-icon" style="color: #003366;"></i>
        <h4 class="form-record-title" style="color: #003366;">Fotos em</h4>
        <span id="fotos-datetime" class="form-record-datetime" style="color: #003366;">{{ now|date:"d/m/Y H:i" }}</span>
        <button type="button" class="btn btn-link btn-sm p-0" onclick="editDatetime('fotos-datetime')" title="Editar data/hora" style="color: #003366;">
          <i class="ti ti-pencil" style="font-size: 20px;"></i>
        </button>
      </div>
      <p class="form-record-user">Por: {{ user.get_full_name|default:user.username }}</p>
    </div>
    <button type="button" class="btn-close" onclick="hideAllForms()"></button>
  </div>

  <!-- Campo hidden para ID do registro (usado na edição) -->
  <input type="hidden" id="fotos-id" name="fotos_id" value="">

  <!-- Campos do formulário -->
  <div class="mb-3">
    <label class="form-label">Título <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="titulo-fotos" required placeholder="Ex: Lesão na pata traseira">
  </div>

  <div class="mb-3">
    <label class="form-label">Descrição</label>
    <textarea class="form-control" id="desc-fotos" rows="3" placeholder="Descrição das fotos"></textarea>
  </div>

  <!-- Fotos já salvas (exibidas ao editar) -->
  <div id="fotos-existentes-wrapper" class="mb-3" style="display:none;">
    <label class="form-label">Fotos Salvas</label>
    <div id="fotos-existentes-grid" class="d-flex flex-wrap gap-2"></div>
    <small class="text-muted">Para remover uma foto, clique no <i class="ti ti-x"></i>.</small>
  </div>

  <div class="mb-3">
    <label class="form-label">Adicionar Fotos</label>
    <input type="file" class="form-control" id="file-fotos" accept="image/*" multiple>
    <small class="text-muted">Formatos aceitos: JPG, PNG, GIF</small>
    <div id="file-badges-fotos" class="file-badges mt-2"></div>
  </div>

  <!-- Lightbox modal -->
<div id="fotos-lightbox" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);align-items:center;justify-content:center;flex-direction:column;gap:12px;">
  <div style="position:relative;max-width:90vw;max-height:80vh;">
    <img id="fotos-lightbox-img" src="" style="max-width:90vw;max-height:80vh;border-radius:8px;box-shadow:0 4px 32px #000;display:block;">
  </div>
  <div class="d-flex gap-2">
    <a id="fotos-lightbox-download" href="" download class="btn btn-primary btn-sm"><i class="ti ti-download me-1"></i>Baixar</a>
    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('fotos-lightbox').style.display='none'"><i class="ti ti-x me-1"></i>Fechar</button>
  </div>
</div>

  <!-- Botões de ação -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn btn-danger btn-delete-record" onclick="deleteCurrentRecord()" style="display: none;">
      <i class="ti ti-trash"></i>
      Excluir
    </button>
    <div class="d-flex gap-2 ms-auto">
      <button type="button" class="btn btn-secondary" onclick="hideAllForms()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="save-fotos">Salvar Fotos</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function toLocalISOString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;
  }

  const usuarioAvatar = '{% if user.userprofile.avatar %}{{ user.userprofile.avatar.url }}{% else %}{{ user.userprofile.get_avatar_url }}{% endif %}';
  let uploadedFilesFotos = [];
  const fileInputFotos = document.getElementById('file-fotos');
  const fileBadgesFotos = document.getElementById('file-badges-fotos');

  fileInputFotos?.addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      if (!uploadedFilesFotos.find(f => f.name === file.name)) {
        uploadedFilesFotos.push(file);
        const badge = document.createElement('span');
        badge.className = 'badge bg-secondary';
        badge.innerHTML = `${file.name} <i class="ti ti-x"></i>`;
        badge.onclick = () => { uploadedFilesFotos = uploadedFilesFotos.filter(f => f.name !== file.name); badge.remove(); };
        fileBadgesFotos.appendChild(badge);
      }
    });
    fileInputFotos.value = '';
  });

  document.getElementById('save-fotos')?.addEventListener('click', function() {
    const titulo = document.getElementById('titulo-fotos').value;
    const fotosId = document.getElementById('fotos-id')?.value;

    if (!titulo) {
      showDangerModal('Erro de Validação', 'Por favor, informe o título');
      return;
    }
    if (!fotosId && uploadedFilesFotos.length === 0) {
      showDangerModal('Erro de Validação', 'Por favor, selecione pelo menos uma foto');
      return;
    }

    // Arquivos a remover
    const idsRemover = Array.from(document.querySelectorAll('#fotos-existentes-grid [data-remove="true"]')).map(el => el.dataset.id);

    const formData = new FormData();
    formData.append('titulo', titulo);
    formData.append('descricao', document.getElementById('desc-fotos').value);
    uploadedFilesFotos.forEach(file => formData.append('arquivos', file));

    const datetimeSpan = document.getElementById('fotos-datetime');
    const now = new Date();
    const isoDate = datetimeSpan?.dataset.isoDate || toLocalISOString(now);
    formData.append('data_hora', isoDate.slice(0, 16));

    if (fotosId) formData.append('fotos_id', fotosId);
    idsRemover.forEach(id => formData.append('remover_arquivo', id));

    const petId = window.CURRENT_PET_ID;
    if (!petId) {
      showDangerModal('Erro de Configuração', 'ID do animal não encontrado');
      return;
    }

    fetch(`/atendimento/api/${petId}/fotos/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      body: formData,
      credentials: 'same-origin'
    })
    .then(response => {
      const contentType = response.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        return response.text().then(() => { throw new Error('Servidor retornou HTML ao invés de JSON. Verifique autenticação.'); });
      }
      return response.json();
    })
    .then(data => {
      if (data.success) {
        if (fotosId) {
          const timeline = document.querySelector('#timeline-list');
          if (timeline) timeline.innerHTML = '';
          carregarTimeline();
        } else {
          adicionarItemTimeline('fotos', titulo, isoDate, `${uploadedFilesFotos.length} foto(s)`, '{{ user.get_full_name|default:user.username }}', usuarioAvatar, data.id);
        }
        hideAllForms();
        showSuccessModal('Sucesso!', fotosId ? 'Fotos atualizadas com sucesso!' : 'Fotos salvas com sucesso!');
        uploadedFilesFotos = [];
        fileBadgesFotos.innerHTML = '';
        document.getElementById('fotos-existentes-wrapper').style.display = 'none';
        document.getElementById('fotos-existentes-grid').innerHTML = '';
      } else {
        showDangerModal('Erro ao Salvar', data.error || 'Ocorreu um erro ao salvar as fotos');
      }
    })
    .catch(error => {
      showDangerModal('Erro de Conexão', 'Não foi possível conectar ao servidor: ' + error.message);
    });
  });
  // Fechar lightbox ao clicar no fundo
  document.getElementById('fotos-lightbox')?.addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
  });

  // Preencher fotos existentes ao editar
  window._preencherFotosExistentes = function(arquivos) {
    const wrapper = document.getElementById('fotos-existentes-wrapper');
    const grid = document.getElementById('fotos-existentes-grid');
    grid.innerHTML = '';
    if (!arquivos || arquivos.length === 0) {
      wrapper.style.display = 'none';
      return;
    }
    arquivos.forEach(arq => {
      const div = document.createElement('div');
      div.className = 'position-relative';
      div.dataset.id = arq.id;
      div.dataset.remove = 'false';
      div.innerHTML = `
        <img src="${arq.url}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #dee2e6;cursor:pointer;" title="Ver foto">
        <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 p-0" style="width:20px;height:20px;line-height:1;font-size:11px;border-radius:50%;" title="Remover">
          <i class="ti ti-x"></i>
        </button>
      `;
      div.querySelector('img').addEventListener('click', function() {
        const lb = document.getElementById('fotos-lightbox');
        document.getElementById('fotos-lightbox-img').src = arq.url;
        document.getElementById('fotos-lightbox-download').href = arq.url;
        lb.style.display = 'flex';
      });
      div.querySelector('button').addEventListener('click', function() {
        div.dataset.remove = 'true';
        div.querySelector('img').style.opacity = '0.3';
        this.style.display = 'none';
      });
      grid.appendChild(div);
    });
    wrapper.style.display = '';
  };
});
</script>
