<!-- Formulário de Observações -->
<div id="form-observacoes" class="form-record">
  <!-- Cabeçalho -->
  <div class="form-record-header">
    <div class="form-record-title-section">
      <div class="form-record-icon-title">
        <i class="ti ti-message form-record-icon" style="color: #6c757d;"></i>
        <h4 class="form-record-title" style="color: #6c757d;">Observações em</h4>
        <span id="observacoes-datetime" class="form-record-datetime" style="color: #6c757d;">{{ now|date:"d/m/Y H:i" }}</span>
        <button type="button" class="btn btn-link btn-sm p-0" onclick="editDatetime('observacoes-datetime')" title="Editar data/hora" style="color: #6c757d;">
          <i class="ti ti-pencil" style="font-size: 20px;"></i>
        </button>
      </div>
      <p class="form-record-user">Por: {{ user.get_full_name|default:user.username }}</p>
    </div>
    <button type="button" class="btn-close" onclick="hideAllForms()"></button>
  </div>

  <!-- Campo hidden para ID do registro (usado na edição) -->
  <input type="hidden" id="observacoes-id" name="observacoes_id" value="">

  <!-- Campos do formulário -->
  <div class="mb-3">
    <label class="form-label">Título <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="titulo-observacoes" required placeholder="Título da observação">
  </div>

  <div class="mb-3">
    <label class="form-label">Observação <span class="text-danger">*</span></label>
    <textarea class="form-control" id="texto-observacoes" rows="6" required placeholder="Digite sua observação"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Categoria</label>
    <select class="form-select" id="categoria-observacoes">
      <option value="">Selecione...</option>
      <option value="comportamento">Comportamento</option>
      <option value="alimentacao">Alimentação</option>
      <option value="geral">Geral</option>
      <option value="importante">Importante</option>
    </select>
  </div>

  <!-- Botões de ação -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn btn-danger btn-delete-record" onclick="deleteCurrentRecord()" style="display: none;">
      <i class="ti ti-trash"></i>
      Excluir
    </button>
    <div class="d-flex gap-2 ms-auto">
      <button type="button" class="btn btn-secondary" onclick="hideAllForms()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="save-observacoes">Salvar Observação</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function toLocalISOString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;
  }

  const usuarioAvatar = '{% if user.userprofile.avatar %}{{ user.userprofile.avatar.url }}{% else %}{{ user.userprofile.get_avatar_url }}{% endif %}';

  document.getElementById('save-observacoes')?.addEventListener('click', function() {
    const titulo = document.getElementById('titulo-observacoes').value;
    const texto = document.getElementById('texto-observacoes').value;
    if (!titulo || !texto) {
      showDangerModal('Erro de Validação', 'Por favor, preencha os campos obrigatórios');
      return;
    }

    const formData = new FormData();
    formData.append('titulo', titulo);
    formData.append('texto', texto);
    formData.append('categoria', document.getElementById('categoria-observacoes').value);

    const datetimeSpan = document.getElementById('observacoes-datetime');
    const now = new Date();
    const isoDate = datetimeSpan?.dataset.isoDate || toLocalISOString(now);
    formData.append('data_hora', isoDate.slice(0, 16));

    const observacoesId = document.getElementById('observacoes-id')?.value;
    if (observacoesId) formData.append('observacoes_id', observacoesId);

    const petId = window.CURRENT_PET_ID;
    if (!petId) {
      showDangerModal('Erro de Configuração', 'ID do animal não encontrado');
      return;
    }

    fetch(`/atendimento/api/${petId}/observacao/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      body: formData,
      credentials: 'same-origin'
    })
    .then(response => {
      const contentType = response.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        return response.text().then(() => { throw new Error('Servidor retornou HTML ao invés de JSON. Verifique autenticação.'); });
      }
      return response.json();
    })
    .then(data => {
      if (data.success) {
        if (observacoesId) {
          const timeline = document.querySelector('#timeline-list');
          if (timeline) timeline.innerHTML = '';
          carregarTimeline();
        } else {
          adicionarItemTimeline('observacoes', titulo, isoDate, texto.substring(0, 100), '{{ user.get_full_name|default:user.username }}', usuarioAvatar, data.id);
        }
        hideAllForms();
        showSuccessModal('Sucesso!', observacoesId ? 'Observação atualizada com sucesso!' : 'Observação salva com sucesso!');
      } else {
        showDangerModal('Erro ao Salvar', data.error || 'Ocorreu um erro ao salvar a observação');
      }
    })
    .catch(error => {
      showDangerModal('Erro de Conexão', 'Não foi possível conectar ao servidor: ' + error.message);
    });
  });
});
</script>
