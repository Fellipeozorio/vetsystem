<!-- Formulário de Patologia -->
<div id="form-patologia" class="form-record">
  <!-- Cabeçalho -->
  <div class="form-record-header">
    <div class="form-record-title-section">
      <div class="form-record-icon-title">
        <i class="ti ti-virus form-record-icon" style="color: #6C2C91;"></i>
        <h4 class="form-record-title" style="color: #6C2C91;">Patologia em</h4>
        <span id="patologia-datetime" class="form-record-datetime" style="color: #6C2C91;">{{ now|date:"d/m/Y H:i" }}</span>
        <button type="button" class="btn btn-link btn-sm p-0" onclick="editDatetime('patologia-datetime')" title="Editar data/hora" style="color: #6C2C91;">
          <i class="ti ti-pencil" style="font-size: 20px;"></i>
        </button>
      </div>
      <p class="form-record-user">Por: {{ user.get_full_name|default:user.username }}</p>
    </div>
    <button type="button" class="btn-close" onclick="hideAllForms()"></button>
  </div>

  <!-- Campo hidden para ID do registro (usado na edição) -->
  <input type="hidden" id="patologia-id" name="patologia_id" value="">

  <!-- Campos do formulário -->
  <div class="row mb-3">
    <div class="col-9">
      <label class="form-label">Patologia <span class="text-danger">*</span></label>
      <select class="form-select" id="select-patologia-cadastro" required>
        <option value="">Selecione a patologia...</option>
      </select>
    </div>
  </div>

  <div class="mb-3" id="protocolo-patologia-wrapper" style="display: none;">
    <label class="form-label fw-semibold" style="color: #6C2C91;">Protocolo padrão</label>
    <div id="protocolo-patologia-texto" class="p-3 rounded border" style="background: #f8f4fc; color: #4a306a; white-space: pre-wrap; height: 300px; overflow-y: auto; font-size: 0.9rem;"></div>
  </div>

  <!-- Botões de ação -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn btn-danger btn-delete-record" onclick="deleteCurrentRecord()" style="display: none;">
      <i class="ti ti-trash"></i>
      Excluir
    </button>
    <div class="d-flex gap-2 ms-auto">
      <button type="button" class="btn btn-secondary" onclick="hideAllForms()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="save-patologia">Salvar Patologia</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function toLocalISOString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;
  }

  const usuarioAvatar = '{% if user.userprofile.avatar %}{{ user.userprofile.avatar.url }}{% else %}{{ user.userprofile.get_avatar_url }}{% endif %}';

  // Carregar opções do select de patologias do cadastro
  window._patologiasCache = window._patologiasCache || null;

  function carregarPatologiasSelect(selectedId) {
    const select = document.getElementById('select-patologia-cadastro');
    if (!select) return;

    const renderOptions = (patologias) => {
      select.innerHTML = '<option value="">Selecione a patologia...</option>';
      patologias.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.nome;
        opt.dataset.descricao = p.descricao || '';
        if (selectedId && String(p.id) === String(selectedId)) opt.selected = true;
        select.appendChild(opt);
      });
      // Exibir protocolo da opção selecionada ao carregar em modo edição
      if (selectedId) select.dispatchEvent(new Event('change'));
    };

    if (window._patologiasCache) {
      renderOptions(window._patologiasCache);
    } else {
      fetch('/cadastros/api/patologias/', { credentials: 'same-origin' })
        .then(r => r.json())
        .then(data => {
          window._patologiasCache = data;
          renderOptions(data);
        });
    }
  }

  carregarPatologiasSelect(null);

  // Exibir protocolo ao selecionar patologia
  document.getElementById('select-patologia-cadastro')?.addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    const descricao = opt?.dataset.descricao || '';
    const wrapper = document.getElementById('protocolo-patologia-wrapper');
    const texto = document.getElementById('protocolo-patologia-texto');
    if (descricao.trim()) {
      texto.textContent = descricao;
      wrapper.style.display = '';
    } else {
      wrapper.style.display = 'none';
    }
  });

  document.getElementById('save-patologia')?.addEventListener('click', function() {
    const select = document.getElementById('select-patologia-cadastro');
    const patologiaCadastroId = select.value;
    const diagnostico = select.options[select.selectedIndex]?.textContent || '';

    if (!patologiaCadastroId) {
      showDangerModal('Erro de Validação', 'Por favor, selecione a patologia');
      return;
    }

    const formData = new FormData();
    formData.append('patologia_cadastro_id', patologiaCadastroId);
    formData.append('diagnostico', diagnostico);

    const datetimeSpan = document.getElementById('patologia-datetime');
    const now = new Date();
    const isoDate = datetimeSpan?.dataset.isoDate || toLocalISOString(now);
    formData.append('data_hora', isoDate.slice(0, 16));

    const patologiaId = document.getElementById('patologia-id')?.value;
    if (patologiaId) formData.append('patologia_id', patologiaId);

    const petId = window.CURRENT_PET_ID;
    if (!petId) {
      showDangerModal('Erro de Configuração', 'ID do animal não encontrado');
      return;
    }

    fetch(`/atendimento/api/${petId}/patologia/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      body: formData,
      credentials: 'same-origin'
    })
    .then(response => {
      const contentType = response.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        return response.text().then(() => { throw new Error('Servidor retornou HTML ao invés de JSON. Verifique autenticação.'); });
      }
      return response.json();
    })
    .then(data => {
      if (data.success) {
        if (patologiaId) {
          const timeline = document.querySelector('#timeline-list');
          if (timeline) timeline.innerHTML = '';
          carregarTimeline();
        } else {
          adicionarItemTimeline('patologia', diagnostico, isoDate, diagnostico, '{{ user.get_full_name|default:user.username }}', usuarioAvatar, data.id);
        }
        hideAllForms();
        showSuccessModal('Sucesso!', patologiaId ? 'Patologia atualizada com sucesso!' : 'Patologia salva com sucesso!');
      } else {
        showDangerModal('Erro ao Salvar', data.error || 'Ocorreu um erro ao salvar a patologia');
      }
    })
    .catch(error => {
      showDangerModal('Erro de Conexão', 'Não foi possível conectar ao servidor: ' + error.message);
    });
  });

  // Expor função para populate ao editar (chamada pelo showForm do historico_base.html)
  window._carregarPatologiasSelectComId = carregarPatologiasSelect;
});
</script>
