<!-- Formulário de Peso -->
<div id="form-peso" class="form-record">
  <!-- Cabeçalho -->
  <div class="form-record-header">
    <div class="form-record-title-section">
      <div class="form-record-icon-title">
        <i class="ti ti-weight form-record-icon" style="color: #8B4513;"></i>
        <h4 class="form-record-title" style="color: #8B4513;">Peso em</h4>
        <span id="peso-datetime" class="form-record-datetime" style="color: #8B4513;">{{ now|date:"d/m/Y H:i" }}</span>
        <button type="button" class="btn btn-link btn-sm p-0" onclick="editDatetime('peso-datetime')" title="Editar data/hora" style="color: #8B4513;">
          <i class="ti ti-pencil" style="font-size: 20px;"></i>
        </button>
      </div>
      <p class="form-record-user">Por: {{ user.get_full_name|default:user.username }}</p>
    </div>
    <button type="button" class="btn-close" onclick="hideAllForms()"></button>
  </div>

  <!-- Campo hidden para ID do registro (usado na edição) -->
  <input type="hidden" id="peso-id" name="peso_id" value="">

  <!-- Campos do formulário -->
  <div class="row mb-3">
    <div class="col-md-6">
      <label class="form-label">Peso (kg) <span class="text-danger">*</span></label>
      <input type="text" inputmode="numeric" class="form-control" id="valor-peso" required placeholder="0,000" autocomplete="off">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Observações</label>
    <textarea class="form-control" id="obs-peso" rows="3" placeholder="Observações sobre a pesagem"></textarea>
  </div>

  <!-- Botões de ação -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn btn-danger btn-delete-record" onclick="deleteCurrentRecord()" style="display: none;">
      <i class="ti ti-trash"></i>
      Excluir
    </button>
    <div class="d-flex gap-2 ms-auto">
      <button type="button" class="btn btn-secondary" onclick="hideAllForms()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="save-peso">Salvar Peso</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function toLocalISOString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;
  }

  const usuarioAvatar = '{% if user.userprofile.avatar %}{{ user.userprofile.avatar.url }}{% else %}{{ user.userprofile.get_avatar_url }}{% endif %}';

  // Máscara de peso: 3 casas decimais com vírgula (ex: 4,500)
  const pesoInput = document.getElementById('valor-peso');
  pesoInput?.addEventListener('input', function() {
    let digits = this.value.replace(/[^0-9]/g, '');
    if (!digits) { this.value = ''; return; }
    while (digits.length < 4) digits = '0' + digits;
    const intPart = digits.slice(0, -3).replace(/^0+/, '') || '0';
    const decPart = digits.slice(-3);
    this.value = intPart + ',' + decPart;
  });

  document.getElementById('save-peso')?.addEventListener('click', function() {
    const peso = document.getElementById('valor-peso').value;
    if (!peso) {
      showDangerModal('Erro de Validação', 'Por favor, informe o peso');
      return;
    }

    const formData = new FormData();
    formData.append('peso', peso);
    formData.append('observacoes', document.getElementById('obs-peso').value);

    const datetimeSpan = document.getElementById('peso-datetime');
    const now = new Date();
    const isoDate = datetimeSpan?.dataset.isoDate || toLocalISOString(now);
    formData.append('data_hora', isoDate.slice(0, 16));

    const pesoId = document.getElementById('peso-id')?.value;
    if (pesoId) formData.append('peso_id', pesoId);

    const petId = window.CURRENT_PET_ID;
    if (!petId) {
      showDangerModal('Erro de Configuração', 'ID do animal não encontrado');
      return;
    }

    fetch(`/atendimento/api/${petId}/peso/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      body: formData,
      credentials: 'same-origin'
    })
    .then(response => {
      const contentType = response.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        return response.text().then(() => { throw new Error('Servidor retornou HTML ao invés de JSON. Verifique autenticação.'); });
      }
      return response.json();
    })
    .then(data => {
      if (data.success) {
        if (pesoId) {
          const timeline = document.querySelector('#timeline-list');
          if (timeline) timeline.innerHTML = '';
          carregarTimeline();
        } else {
          adicionarItemTimeline('peso', `${peso} kg`, isoDate, `${peso} kg`, '{{ user.get_full_name|default:user.username }}', usuarioAvatar, data.id);
        }
        hideAllForms();
        showSuccessModal('Sucesso!', pesoId ? 'Peso atualizado com sucesso!' : 'Peso salvo com sucesso!');
      } else {
        showDangerModal('Erro ao Salvar', data.error || 'Ocorreu um erro ao salvar o peso');
      }
    })
    .catch(error => {
      showDangerModal('Erro de Conexão', 'Não foi possível conectar ao servidor: ' + error.message);
    });
  });
});
</script>
