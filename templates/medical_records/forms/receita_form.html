{% load static %}
<!-- Formulário de Receita -->
<div id="form-receita" class="form-record">
  <!-- Cabeçalho -->
  <div class="form-record-header">
    <div class="form-record-title-section">
      <div class="form-record-icon-title">
        <i class="ti ti-edit form-record-icon" style="color: #9370DB;"></i>
        <h4 class="form-record-title" style="color: #9370DB;">Receita</h4>
        <span id="receita-datetime" class="form-record-datetime" style="color: #9370DB;">{{ now|date:"d/m/Y H:i" }}</span>
        <button type="button" class="btn btn-link btn-sm p-0" onclick="editDatetime('receita-datetime')" title="Editar data/hora" style="color: #9370DB;">
          <i class="ti ti-pencil" style="font-size: 20px;"></i>
        </button>
      </div>
      <p class="form-record-user">Por: {{ user.get_full_name|default:user.username }}</p>
    </div>
    <button type="button" class="btn-close" onclick="hideAllForms()"></button>
  </div>

  <!-- Campo hidden para ID do registro (usado na edição) -->
  <input type="hidden" id="receita-id" value="">

  <!-- Select do modelo de receita -->
  <div class="row mb-3">
    <div class="col-9">
      <label class="form-label">Modelo de Receita <span class="text-danger">*</span></label>
      <select class="form-select" id="select-modelo-receita">
        <option value="">Selecione um modelo...</option>
      </select>
    </div>
  </div>

  <!-- Área do editor (aparece ao selecionar modelo) -->
  <div id="editor-area-receita" style="display:none;">
    <div class="row">
      <div class="col-12">
        <label class="form-label">Conteúdo</label>
        <div id="loading-editor-receita" style="height:300px;border:1px solid #e2e8f0;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#64748b;font-size:14px;">
          Carregando editor...
        </div>
        <div id="editor-container-receita" style="display:none;">
          <textarea id="editor-receita"></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Botões de ação -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn btn-danger btn-delete-record" onclick="deleteCurrentRecord()" style="display:none;">
      <i class="ti ti-trash"></i> Excluir
    </button>
    <div class="d-flex gap-2 ms-auto">
      <button type="button" class="btn btn-outline-secondary" id="btn-imprimir-receita" onclick="imprimirReceita()" style="display:none;align-items:center;gap:6px;">
        <i class="ti ti-printer" style="font-size:16px;line-height:1;vertical-align:middle;"></i>
        <span style="vertical-align:middle;">Imprimir</span>
      </button>
      <button type="button" class="btn btn-secondary" onclick="hideAllForms()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="save-receita">Salvar Receita</button>
    </div>
  </div>
</div>

<!-- Dados da clínica para impressão de receita -->
<script>
window._receitaClinica = {
  nome:     '{{ clinica.nome_empreendimento|default:""|escapejs }}',
  logo:     '{% if clinica and clinica.logomarca %}{{ clinica.logomarca.url }}{% endif %}',
  endereco: '{{ clinica.endereco|default:""|escapejs }}',
  bairro:   '{{ clinica.bairro|default:""|escapejs }}',
  cidade:   '{{ clinica.cidade|default:""|escapejs }}',
  estado:   '{{ clinica.estado|default:""|escapejs }}',
  cep:      '{{ clinica.cep|default:""|escapejs }}',
  telefone: '{{ clinica.telefone_comercial|default:""|escapejs }}',
  celular:  '{{ clinica.celular|default:""|escapejs }}',
  email:    '{{ clinica.email|default:""|escapejs }}',
  cnpj:     '{{ clinica.cnpj|default:""|escapejs }}',
  crmv:     '{{ clinica.registro_crmv|default:""|escapejs }}'
};
window._receitaModeloAtual = null;
</script>

<!-- Função de impressão de receita (global) -->
<script>
function imprimirReceita() {
  if (!window._receitaModeloAtual) {
    if (typeof showDangerModal === 'function')
      showDangerModal('Sem modelo', 'Selecione um modelo de receita antes de imprimir.');
    return;
  }
  const modelo  = window._receitaModeloAtual;
  const ctx     = window.dadosContexto || {};
  const pet     = ctx.pet     || {};
  const cliente = ctx.cliente || {};
  const dc      = window._receitaClinica || {};

  const conteudo = (window.HugeRTEEditor && HugeRTEEditor.getEditor('editor-receita'))
    ? HugeRTEEditor.getContent('editor-receita')
    : (document.getElementById('editor-receita') ? document.getElementById('editor-receita').value : '');

  const encerramento = (window.substituirEtiquetas && ctx)
    ? window.substituirEtiquetas(modelo.conteudo_encerramento || '', ctx)
    : (modelo.conteudo_encerramento || '');

  const pw = window.open('', '_blank');
  if (!pw) {
    if (typeof showDangerModal === 'function')
      showDangerModal('Popup bloqueado', 'Permita popups para este site e tente novamente.');
    return;
  }
  pw.document.write('<html><body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#555;"><p>Gerando PDF...</p></body></html>');

  fetch('/atendimento/imprimir-receita/', {
    method: 'POST',
    credentials: 'same-origin',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify({
      modelo:       modelo,
      pet:          pet,
      cliente:      cliente,
      clinica:      dc,
      conteudo:     conteudo,
      encerramento: encerramento
    })
  })
  .then(r => {
    if (!r.ok) return r.json().then(e => { throw new Error(e.error || 'Erro ao gerar PDF'); });
    return r.json();
  })
  .then(data => { pw.location.href = data.url; })
  .catch(err => {
    pw.close();
    if (typeof showDangerModal === 'function')
      showDangerModal('Erro de impressão', err.message);
    else
      alert('Erro ao gerar PDF: ' + err.message);
  });
}
</script>

<!-- Lógica do formulário -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const selectModelo   = document.getElementById('select-modelo-receita');
  const editorArea     = document.getElementById('editor-area-receita');
  const btnImprimir    = document.getElementById('btn-imprimir-receita');
  let _editorInited    = false;

  function toLocalISOString(date) {
    const p = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}:${p(date.getSeconds())}`;
  }

  function substituirEtiquetasRec(tmpl) {
    return (window.substituirEtiquetas && window.dadosContexto)
      ? window.substituirEtiquetas(tmpl, window.dadosContexto)
      : tmpl;
  }

  function carregarModelos() {
    fetch('/cadastros/api/modelos-receita/', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(data => {
        selectModelo.innerHTML = '<option value="">Selecione um modelo...</option>';
        data.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.nome;
          selectModelo.appendChild(opt);
        });
      })
      .catch(err => console.error('Erro ao carregar modelos de receita:', err));
  }

  function initEditorRec() {
    const loading   = document.getElementById('loading-editor-receita');
    const container = document.getElementById('editor-container-receita');

    if (loading) loading.style.display = 'flex';
    if (container) container.style.display = 'none';

    if (!window.HugeRTEEditor) {
      if (loading) loading.style.display = 'none';
      if (container) container.style.display = 'block';
      _editorInited = true;
      return Promise.resolve();
    }

    return HugeRTEEditor.init('#editor-receita', { height: 350, min_height: 350 }, 'editor-receita')
      .then(() => {
        if (loading) loading.style.display = 'none';
        if (container) container.style.display = 'block';
        _editorInited = true;
      })
      .catch(err => {
        console.error('Erro HugeRTE receita:', err);
        if (loading) loading.style.display = 'none';
        if (container) container.style.display = 'block';
        _editorInited = true;
      });
  }

  function carregarModelo(modeloId, conteudoOverride) {
    fetch(`/cadastros/api/modelos-receita/${modeloId}/`, { credentials: 'same-origin' })
      .then(r => r.json())
      .then(modelo => {
        window._receitaModeloAtual = modelo;

        const conteudo = conteudoOverride !== undefined
          ? conteudoOverride
          : substituirEtiquetasRec(modelo.conteudo_apresentacao || '');

        editorArea.style.display = '';
        if (btnImprimir) btnImprimir.style.display = '';

        if (!_editorInited) {
          initEditorRec().then(() => definirConteudo(conteudo));
        } else {
          definirConteudo(conteudo);
        }
      })
      .catch(err => console.error('Erro ao carregar modelo de receita:', err));
  }

  function definirConteudo(conteudo) {
    if (window.HugeRTEEditor && HugeRTEEditor.getEditor('editor-receita')) {
      HugeRTEEditor.setContent('editor-receita', conteudo);
    } else {
      const ta = document.getElementById('editor-receita');
      if (ta) ta.value = conteudo;
    }
  }

  selectModelo.addEventListener('change', function() {
    const modeloId = this.value;
    if (!modeloId) {
      editorArea.style.display = 'none';
      if (btnImprimir) btnImprimir.style.display = 'none';
      window._receitaModeloAtual = null;
      return;
    }
    carregarModelo(modeloId);
  });

  // Exposto para o historico_base (edição de registro existente)
  window._carregarModeloReceitaComConteudo = function(modeloId, conteudo) {
    if (!modeloId) return;
    selectModelo.value = modeloId;
    carregarModelo(modeloId, conteudo);
  };

  // Salvar
  document.getElementById('save-receita')?.addEventListener('click', function() {
    const modeloId = selectModelo.value;
    if (!modeloId) {
      showDangerModal('Erro de Validação', 'Selecione um modelo de receita.');
      return;
    }

    let conteudo = '';
    if (window.HugeRTEEditor && HugeRTEEditor.getEditor('editor-receita')) {
      conteudo = HugeRTEEditor.getContent('editor-receita');
    } else {
      const ta = document.getElementById('editor-receita');
      if (ta) conteudo = ta.value;
    }

    const receitaId = document.getElementById('receita-id')?.value;
    const datetimeSpan = document.getElementById('receita-datetime');
    const now = new Date();
    const isoDate = datetimeSpan?.dataset.isoDate || toLocalISOString(now);

    const formData = new FormData();
    formData.append('modelo_receita_id', modeloId);
    formData.append('conteudo', conteudo);
    formData.append('data_hora', isoDate.slice(0, 16));
    if (receitaId) formData.append('receita_id', receitaId);

    const petId = window.CURRENT_PET_ID;
    if (!petId) { showDangerModal('Erro', 'ID do animal não encontrado.'); return; }

    fetch(`/atendimento/api/${petId}/receita/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      body: formData,
      credentials: 'same-origin'
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        const titulo = window._receitaModeloAtual ? window._receitaModeloAtual.nome : 'Receita';
        if (receitaId) {
          carregarTimeline();
        } else {
          const avatar = '{% if user.userprofile.avatar %}{{ user.userprofile.avatar.url }}{% else %}{{ user.userprofile.get_avatar_url }}{% endif %}';
          adicionarItemTimeline('receita', titulo, isoDate, titulo, '{{ user.get_full_name|default:user.username }}', avatar, data.id);
        }
        hideAllForms();
        showSuccessModal('Sucesso!', receitaId ? 'Receita atualizada!' : 'Receita salva com sucesso!');
      } else {
        showDangerModal('Erro ao Salvar', data.error || 'Ocorreu um erro ao salvar a receita.');
      }
    })
    .catch(err => showDangerModal('Erro de Conexão', 'Não foi possível conectar ao servidor: ' + err.message));
  });

  carregarModelos();
});
</script>
