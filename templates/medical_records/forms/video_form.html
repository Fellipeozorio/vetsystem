<!-- Formulário de Vídeo -->
<div id="form-video" class="form-record">
  <!-- Cabeçalho -->
  <div class="form-record-header">
    <div class="form-record-title-section">
      <div class="form-record-icon-title">
        <i class="ti ti-video form-record-icon" style="color: #006400;"></i>
        <h4 class="form-record-title" style="color: #006400;">Vídeo em</h4>
        <span id="video-datetime" class="form-record-datetime" style="color: #006400;">{{ now|date:"d/m/Y H:i" }}</span>
        <button type="button" class="btn btn-link btn-sm p-0" onclick="editDatetime('video-datetime')" title="Editar data/hora" style="color: #006400;">
          <i class="ti ti-pencil" style="font-size: 20px;"></i>
        </button>
      </div>
      <p class="form-record-user">Por: {{ user.get_full_name|default:user.username }}</p>
    </div>
    <button type="button" class="btn-close" onclick="hideAllForms()"></button>
  </div>

  <!-- Campo hidden para ID do registro (usado na edição) -->
  <input type="hidden" id="video-id" name="video_id" value="">

  <!-- Campos do formulário -->
  <div class="mb-3">
    <label class="form-label">Título <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="titulo-video" required placeholder="Ex: Comportamento do animal">
  </div>

  <div class="mb-3">
    <label class="form-label">Descrição</label>
    <textarea class="form-control" id="desc-video" rows="3" placeholder="Descrição do vídeo"></textarea>
  </div>

  <!-- Vídeo já salvo (exibido ao editar) -->
  <div id="video-existente-wrapper" class="mb-3" style="display:none;" data-remove="false">
    <label class="form-label">Vídeo Salvo</label>
    <div id="video-existente-card" class="d-flex align-items-center gap-2 p-2 border rounded bg-light">
      <i class="ti ti-video" style="font-size:32px;color:#006400;"></i>
      <span id="video-existente-nome" class="flex-grow-1 text-truncate"></span>
      <button type="button" class="btn btn-outline-primary btn-sm" id="video-existente-play" title="Assistir">
        <i class="ti ti-player-play"></i>
      </button>
      <a id="video-existente-download" href="" download class="btn btn-outline-secondary btn-sm" title="Baixar">
        <i class="ti ti-download"></i>
      </a>
      <button type="button" class="btn btn-outline-danger btn-sm" id="video-existente-remover" title="Remover vídeo">
        <i class="ti ti-trash"></i>
      </button>
    </div>
    <small class="text-muted" id="video-existente-hint">Para substituir, selecione um novo arquivo abaixo.</small>
  </div>

  <div class="mb-3">
    <label class="form-label">Adicionar Vídeo</label>
    <input type="file" class="form-control" id="file-video" accept="video/*">
    <small class="text-muted">Formatos aceitos: MP4, AVI, MOV</small>
    <div id="file-badges-video" class="file-badges mt-2"></div>
  </div>

  <!-- Lightbox modal para vídeo -->
  <div id="video-lightbox" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);align-items:center;justify-content:center;flex-direction:column;gap:12px;">
    <video id="video-lightbox-player" controls style="max-width:90vw;max-height:80vh;border-radius:8px;box-shadow:0 4px 32px #000;"></video>
    <div class="d-flex gap-2">
      <a id="video-lightbox-download" href="" download class="btn btn-primary btn-sm"><i class="ti ti-download me-1"></i>Baixar</a>
      <button type="button" class="btn btn-secondary btn-sm" id="video-lightbox-fechar"><i class="ti ti-x me-1"></i>Fechar</button>
    </div>
  </div>

  <!-- Botões de ação -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn btn-danger btn-delete-record" onclick="deleteCurrentRecord()" style="display: none;">
      <i class="ti ti-trash"></i>
      Excluir
    </button>
    <div class="d-flex gap-2 ms-auto">
      <button type="button" class="btn btn-secondary" onclick="hideAllForms()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="save-video">Salvar Vídeo</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function toLocalISOString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;
  }

  const usuarioAvatar = '{% if user.userprofile.avatar %}{{ user.userprofile.avatar.url }}{% else %}{{ user.userprofile.get_avatar_url }}{% endif %}';
  let uploadedFileVideo = null;
  const fileInputVideo = document.getElementById('file-video');
  const fileBadgesVideo = document.getElementById('file-badges-video');

  fileInputVideo?.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      uploadedFileVideo = file;
      fileBadgesVideo.innerHTML = '';
      const badge = document.createElement('span');
      badge.className = 'badge bg-secondary';
      badge.innerHTML = `${file.name} <i class="ti ti-x"></i>`;
      badge.onclick = () => { uploadedFileVideo = null; fileBadgesVideo.innerHTML = ''; fileInputVideo.value = ''; };
      fileBadgesVideo.appendChild(badge);
    }
  });

  // Lightbox para vídeo
  document.getElementById('video-lightbox-fechar')?.addEventListener('click', function() {
    const lb = document.getElementById('video-lightbox');
    document.getElementById('video-lightbox-player').pause();
    lb.style.display = 'none';
  });
  document.getElementById('video-lightbox')?.addEventListener('click', function(e) {
    if (e.target === this) {
      document.getElementById('video-lightbox-player').pause();
      this.style.display = 'none';
    }
  });

  document.getElementById('save-video')?.addEventListener('click', function() {
    const titulo = document.getElementById('titulo-video').value;
    const videoId = document.getElementById('video-id')?.value;

    if (!titulo) {
      showDangerModal('Erro de Validação', 'Por favor, informe o título');
      return;
    }
    const videoExistenteWrapper = document.getElementById('video-existente-wrapper');
    const videoMarcadoRemover = videoExistenteWrapper?.dataset.remove === 'true';
    if (!videoId && !uploadedFileVideo) {
      showDangerModal('Erro de Validação', 'Por favor, selecione um vídeo');
      return;
    }
    if (videoId && videoMarcadoRemover && !uploadedFileVideo) {
      showDangerModal('Erro de Validação', 'Selecione um novo vídeo para substituir o removido');
      return;
    }

    const formData = new FormData();
    formData.append('titulo', titulo);
    formData.append('descricao', document.getElementById('desc-video').value);
    if (uploadedFileVideo) formData.append('arquivo', uploadedFileVideo);

    const datetimeSpan = document.getElementById('video-datetime');
    const now = new Date();
    const isoDate = datetimeSpan?.dataset.isoDate || toLocalISOString(now);
    formData.append('data_hora', isoDate.slice(0, 16));

    if (videoId) formData.append('video_id', videoId);
    if (videoMarcadoRemover) formData.append('remover_arquivo', '1');

    const petId = window.CURRENT_PET_ID;
    if (!petId) {
      showDangerModal('Erro de Configuração', 'ID do animal não encontrado');
      return;
    }

    fetch(`/atendimento/api/${petId}/video/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      body: formData,
      credentials: 'same-origin'
    })
    .then(response => {
      const contentType = response.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        return response.text().then(() => { throw new Error('Servidor retornou HTML ao invés de JSON. Verifique autenticação.'); });
      }
      return response.json();
    })
    .then(data => {
      if (data.success) {
        if (videoId) {
          const timeline = document.querySelector('#timeline-list');
          if (timeline) timeline.innerHTML = '';
          carregarTimeline();
        } else {
          adicionarItemTimeline('video', titulo, isoDate, titulo, '{{ user.get_full_name|default:user.username }}', usuarioAvatar, data.id);
        }
        hideAllForms();
        showSuccessModal('Sucesso!', videoId ? 'Vídeo atualizado com sucesso!' : 'Vídeo salvo com sucesso!');
        uploadedFileVideo = null;
        fileBadgesVideo.innerHTML = '';
        const wrapper = document.getElementById('video-existente-wrapper');
        wrapper.style.display = 'none';
        wrapper.dataset.remove = 'false';
        document.getElementById('video-existente-nome').textContent = '';
        document.getElementById('video-existente-card').style.opacity = '1';
        document.getElementById('video-existente-remover').style.display = '';
      } else {
        showDangerModal('Erro ao Salvar', data.error || 'Ocorreu um erro ao salvar o vídeo');
      }
    })
    .catch(error => {
      showDangerModal('Erro de Conexão', 'Não foi possível conectar ao servidor: ' + error.message);
    });
  });

  // Preencher vídeo existente ao editar
  window._preencherVideoExistente = function(url, nome) {
    const wrapper = document.getElementById('video-existente-wrapper');
    if (!url) {
      wrapper.style.display = 'none';
      return;
    }
    wrapper.dataset.remove = 'false';
    document.getElementById('video-existente-card').style.opacity = '1';
    document.getElementById('video-existente-nome').textContent = nome || 'vídeo';
    document.getElementById('video-existente-download').href = url;
    document.getElementById('video-existente-remover').style.display = '';
    document.getElementById('video-existente-remover').onclick = function() {
      wrapper.dataset.remove = 'true';
      document.getElementById('video-existente-card').style.opacity = '0.35';
      this.style.display = 'none';
      document.getElementById('video-existente-hint').textContent = 'Vídeo marcado para remoção. Selecione um novo arquivo abaixo.';
    };
    document.getElementById('video-existente-play').onclick = function() {
      const lb = document.getElementById('video-lightbox');
      const player = document.getElementById('video-lightbox-player');
      player.src = url;
      document.getElementById('video-lightbox-download').href = url;
      lb.style.display = 'flex';
      player.play();
    };
    wrapper.style.display = '';
  };
});
</script>
