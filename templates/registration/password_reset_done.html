<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title>Email Enviado - VetSystem</title>
    <!-- Tabler CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/dist/tabler-icons.min.css" rel="stylesheet"/>
</head>
<body class="d-flex flex-column">
    <div class="page page-center">
        <div class="container container-tight py-4">
            <!-- Logo -->
            <div class="text-center mb-4">
                <a href="/" class="navbar-brand navbar-brand-autodark">
                    <h1>VetSystem</h1>
                </a>
            </div>
            
            <div class="card card-md">
                <div class="card-body text-center">
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-mail-check text-success" width="80" height="80" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                            <path d="M11 19h-6a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v6"></path>
                            <path d="M3 7l9 6l9 -6"></path>
                            <path d="M15 19l2 2l4 -4"></path>
                        </svg>
                    </div>
                    <h2 class="h2 text-center mb-4">Verifique seu email</h2>
                    <p class="text-muted mb-4">
                        Enviamos instruções para redefinir sua senha. Por favor, verifique sua caixa de entrada.
                    </p>
                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="btn btn-link">
                            Voltar ao Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Tabler JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>
